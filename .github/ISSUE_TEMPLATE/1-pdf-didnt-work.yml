name: "My PDF didn't work · لم ينجح ملف PDF · Mon PDF n'a pas marché"
description: "No code needed. Tell us what happened with your book. · لا حاجة إلى البرمجة: أخبرنا بما حدث. · Aucune connaissance technique nécessaire."
title: "[PDF] "
labels: [pdf-help, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying Warqa! Answer what you can; "I don't know" is a fine answer.
        **Never paste an API key**, and do not share a PDF you are not allowed to share or anything about your students.

        <div dir="rtl" lang="ar">

        شكرًا لتجربتك «ورقة»! أجب بما تعرفه، وعبارة «لا أعرف» جواب مقبول. يمكنك الكتابة بالعربية.
        **لا تلصق أبدًا مفتاح API**، ولا تشارك ملفًا لا يحق لك نشره ولا أي معلومات عن تلاميذك.

        </div>

        Merci d'avoir essayé Warqa ! Répondez à ce que vous pouvez ; « je ne sais pas » est une bonne réponse. Vous pouvez écrire en français.
        **Ne collez jamais de clé d'API**, ni un PDF que vous n'avez pas le droit de partager, ni rien sur vos élèves.

  - type: dropdown
    id: how
    attributes:
      label: "How did you use Warqa? · كيف استعملت «ورقة»؟ · Comment avez-vous utilisé Warqa ?"
      options:
        - "The web app in my browser (no install)"
        - "The one-click launcher (double-click)"
        - "Docker"
        - "The command line (warqa …)"
        - "I don't know · لا أعرف · Je ne sais pas"
    validations:
      required: true

  - type: dropdown
    id: pdf-language
    attributes:
      label: "Language of the PDF · لغة الملف · Langue du PDF"
      multiple: true
      options:
        - "Arabic · العربية"
        - "French · Français"
        - "English"
        - "Other · أخرى · Autre"
    validations:
      required: true

  - type: dropdown
    id: pdf-kind
    attributes:
      label: "What kind of PDF? · ما نوع الملف؟ · Quel genre de PDF ?"
      description: "Can you select and copy words in it? · هل يمكنك تحديد الكلمات ونسخها؟ · Pouvez-vous sélectionner et copier le texte ?"
      options:
        - "Text I can select (a digital textbook)"
        - "Scanned pages or photos (I cannot select the text)"
        - "I don't know · لا أعرف · Je ne sais pas"
    validations:
      required: true

  - type: dropdown
    id: step
    attributes:
      label: "Where did it stop? · أين توقّف العمل؟ · Où est-ce que ça a bloqué ?"
      options:
        - "Starting Warqa"
        - "Read the PDF · قراءة الملف · Lire le PDF"
        - "Plan · الخطة · Plan"
        - "Make lessons · إنشاء الدروس · Créer les leçons"
        - "Translate & narrate · الترجمة والتعليق الصوتي · Traduire et narrer"
        - "Export · التصدير · Exporter"
        - "Watching the lesson · مشاهدة الدرس · Regarder la leçon"
        - "I don't know · لا أعرف · Je ne sais pas"
    validations:
      required: true

  - type: textarea
    id: what-you-saw
    attributes:
      label: "What did you see? · ماذا رأيت؟ · Qu'avez-vous vu ?"
      description: "Copy the message you saw, or describe it. You can drag a screenshot here. · انسخ الرسالة أو صفها، ويمكنك سحب لقطة شاشة إلى هنا. · Copiez le message ou décrivez-le ; vous pouvez glisser une capture d'écran ici."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "What did you expect? · ماذا كنت تنتظر؟ · À quoi vous attendiez-vous ?"
    validations:
      required: false

  - type: input
    id: pdf-link
    attributes:
      label: "Where can we find this PDF? · أين نجد هذا الملف؟ · Où trouver ce PDF ?"
      description: "A public link (for example a ministry website) or the book's name and grade. Please don't upload copyrighted books. · رابط عام (موقع الوزارة مثلًا) أو اسم الكتاب والمستوى. · Un lien public (site du ministère, par exemple) ou le titre et le niveau."
    validations:
      required: false

  - type: dropdown
    id: ai
    attributes:
      label: "Which AI service? · أي خدمة ذكاء اصطناعي؟ · Quel service d'IA ?"
      options:
        - "Google Gemini"
        - "DeepSeek"
        - "OpenRouter"
        - "Anthropic (Claude)"
        - "OpenAI"
        - "Mistral"
        - "On my computer (Ollama, LM Studio…)"
        - "Other · أخرى · Autre"
        - "I don't know · لا أعرف · Je ne sais pas"
    validations:
      required: false

  - type: dropdown
    id: computer
    attributes:
      label: "Your computer · حاسوبك · Votre ordinateur"
      options:
        - "Windows"
        - "Mac"
        - "Linux"
        - "Chromebook"
        - "Phone or tablet · هاتف أو لوحة · Téléphone ou tablette"
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: "Before you send · قبل الإرسال · Avant d'envoyer"
      options:
        - label: "I did not paste an API key or private information about students. · لم ألصق مفتاحًا ولا معلومات خاصة عن التلاميذ. · Je n'ai collé ni clé d'API ni information privée sur des élèves."
          required: true
