name: Release

# Push a tag like v0.2.0 to publish the Docker image and the GitHub Release (see docs/en/release.md).
# Run it by hand ("Run workflow") to test the multi-arch image build without pushing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tag matches package.json and CHANGELOG.md
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          pkg="$(jq -r .version package.json)"
          if [ "$pkg" != "$version" ]; then
            echo "::error file=package.json::The tag is $TAG but package.json says $pkg. Bump the version before tagging."
            exit 1
          fi
          bash .github/scripts/release-notes.sh "$TAG" > /dev/null

  image:
    name: Docker image (amd64, arm64)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # arm64 is built under QEMU emulation: slower, but one job and one manifest.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names are lower-cased by the action. 0.x releases get 0.1.2 and 0.1 (no bare "0");
      # pre-releases (v1.0.0-rc.1) get only their exact tag; "latest" follows the newest stable tag.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=sha,enable=${{ github.ref_type != 'tag' }}
          labels: |
            org.opencontainers.image.title=Warqa
            org.opencontainers.image.description=Warqa studio and CLI: turn PDFs into animated, narrated, interactive lessons.

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=warqa
          cache-to: type=gha,scope=warqa,mode=max

  release:
    name: GitHub Release
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          bash .github/scripts/release-notes.sh "$TAG" > "$notes"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v}"
          {
            echo
            echo '---'
            echo
            echo "**Docker image:** \`docker pull $image\` (linux/amd64, linux/arm64)"
            echo
            echo "First time? Start with the guide: [English](docs/en/start-here.md) · [العربية](docs/ar/start-here.md) · [Français](docs/fr/start-here.md)"
          } >> "$notes"
          sed -i "s#](docs/#](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/#g" "$notes"
          cat "$notes"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "Warqa $TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
